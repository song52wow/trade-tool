[project]
name = "trade-tool-python"
version = "0.0.0"
description = "trade-tool 的 Python 计算层（uv workspace 根）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "quant-backtest",
    "quant-core",
    "quant-data",
]

[tool.uv]
# workspace 根是虚拟项目，不参与打包发布
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quant-core = { workspace = true }
quant-data = { workspace = true }
quant-backtest = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = "-q"
pythonpath = ["packages/quant-core/src", "packages/quant-data/src", "packages/quant-backtest/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF"]
ignore = [
    # 本仓库注释与文档为中文，全角标点（，。；：（））会被误判为「易混淆的 ASCII 同形字符」
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试夹具大量使用动态类型（`Any` 返回的工厂函数、monkeypatch 替身），
# 与 mypy 的 `[[tool.mypy.overrides]] module = ["*.tests.*"]` 是同一件事：
# 测试要的是「能把替身塞进去」，精确类型在这里没有价值。
# N802：用例名沿用中文以便与需求编号对照（`test_onboard首日的1d桶应当出现`），
# 但 ruff 只认 snake_case 的 ASCII 标识符。中文名是本仓库的既有约定，
# 与上面忽略 RUF001~003 是同一类「工具看不懂中文」的情况。
"*/tests/*" = ["N802", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/quant-core/src:packages/quant-data/src:packages/quant-backtest/src"
files = [
    "packages/quant-core/src",
    "packages/quant-core/tests",
    "packages/quant-data/src",
    "packages/quant-data/tests",
    "packages/quant-backtest/src",
    "packages/quant-backtest/tests",
]

[[tool.mypy.overrides]]
# 测试里的参数化数据（dict / MagicMock 等）不强制逐个标注精确类型
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_any_explicit = false
